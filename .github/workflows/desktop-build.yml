# ===================================================================
# GitHub Actions — 多平台桌面版打包
# ===================================================================
# PyInstaller 不支持交叉编译，因此在各自原生 runner 上分别构建：
#   - windows-latest  -> windows-x64    -> ZIP（exe + browser/）
#   - macos-15-intel  -> macos-x64      -> DMG（.app）
#   - macos-15        -> macos-arm64    -> DMG（.app）
#   - ubuntu-latest   -> linux-x64      -> TAR.GZ（可执行文件 + browser/）
#
# build job 只上传 artifact；release job 汇总后统一发布，避免并发写 Releases
# 导致某个平台的附件丢失。
# ===================================================================
name: Desktop Build

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      no_chrome:
        description: 不打包 Chromium（产物更小，但运行环境需自行安装浏览器）
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-15
            target: macos-arm64
          - os: ubuntu-latest
            target: linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Chromium system dependencies (Linux)
        if: matrix.target == 'linux-x64'
        run: uv run python -m playwright install-deps chromium

      - name: Build desktop app
        shell: bash
        env:
          BUILD_ARGS: ${{ (github.event_name == 'workflow_dispatch' && inputs.no_chrome) && '--no-chrome' || '' }}
        run: uv run python build.py --clean $BUILD_ARGS

      - name: Create Windows ZIP
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $version = (Select-String -Path backend/version.py -Pattern '__version__ = "(.*)"').Matches[0].Groups[1].Value
          $archive = "course-report-generator-${{ matrix.target }}-v$version.zip"
          Compress-Archive -Path "dist/*" -DestinationPath $archive -Force
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE=$archive"

      - name: Create macOS DMG
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/version.py)
          ARCHIVE="course-report-generator-${{ matrix.target }}-v${VERSION}.dmg"
          hdiutil create -volname "课程报告生成工具" -srcfolder dist -ov -format UDZO "$ARCHIVE"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Create Linux TAR.GZ
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/version.py)
          ARCHIVE="course-report-generator-${{ matrix.target }}-v${VERSION}.tar.gz"
          tar -czf "$ARCHIVE" -C dist .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all packages
        uses: actions/download-artifact@v7
        with:
          path: packages
          pattern: package-*

      - name: Remove stale package assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for asset in $(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' 2>/dev/null | grep '^course-report-generator-' || true); do
            gh release delete-asset "${GITHUB_REF_NAME}" "$asset" -y
          done

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v3
        with:
          files: packages/*/*
          generate_release_notes: true
