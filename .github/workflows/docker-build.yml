# ===================================================================
# GitHub Actions — 构建 Docker 镜像并推送到 GHCR
# ===================================================================
# 触发条件：
#   - 语义化版本 tag（v1.0.0, v2.1.3 等）
#
# 镜像托管：ghcr.io/<owner>/course-report-generator
# 同时构建 amd64 / arm64，方便 Apple Silicon 直接拉取。
# ===================================================================
name: Docker Build & Push

on:
  push:
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set lowercase image name
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=${REGISTRY}/${OWNER}/course-report-generator" >> "$GITHUB_ENV"

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/version.py)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
