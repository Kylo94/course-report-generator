# 课程报告生成工具 — 部署栈（GHCR 镜像）
# 宿主机端口固定为 8765，只保留一个入口。
#
# ★ 需要修改的地方 ★
#   AI 配置：启动后访问 http://localhost:8765 的「设置」页面填写
#   数据（含用户设置与加密密钥）持久化在 ./data 目录
#
# 常用命令：
#   docker compose up -d --build  本地构建并启动
#   docker compose restart         改完配置重启
#   docker compose logs -f         查看日志
#   docker compose down            停止

services:
  course-report-generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: course-report-generator:local
    container_name: course-report
    restart: unless-stopped

    # 只发布宿主机 8765 端口（局域网访问 kylo.local:8765 / 手机/同事访问）
    # 不再提供 8767 入口，避免浏览器打开两个不同 origin 看到不同缓存状态。
    # 第一次启用 8765 时，macOS 可能弹防火墙授权，务必点"允许"。
    ports:
      - "8765:8765"

    volumes:
      - ./data:/app/data
      - /Users/kylo/Documents/Workspace:/Users/kylo/Documents/Workspace
      - /Users/kylo/Desktop:/Users/kylo/Desktop
      - /Users/kylo/Documents:/Users/kylo/Documents
      - /Users/kylo/Library/CloudStorage/飞牛同步-瓦力文档同步:/Users/kylo/Documents/Share

# 注释掉的命名卷（保留作为备选写法）：
#   - crg_data:/app/data
#
# 两者的区别：
#   命名卷（crg_data）— 数据存放在 Docker 管理目录（~/Library/Containers/...），
#                     适合纯容器场景，但本地看不到、不便直接备份/编辑。
#   bind mount       — 直接用宿主机 ./data 目录，方便备份、查看、跨容器复用。
#                     macOS 上首次启动会略慢（virtiofs），但对 SQLite + 静态文件无感。

volumes:
  crg_data:
