# 课程报告生成工具 — 从 GitHub Container Registry 拉取镜像运行
#
# 用法：
#   echo <PAT> | docker login ghcr.io -u Kylo94 --password-stdin
#   docker compose -f docker-compose.ghcr.yml up -d
#
# 指定版本（默认 latest）：
#   CRG_IMAGE_TAG=1.4.0 docker compose -f docker-compose.ghcr.yml up -d
#
# 注意：与 docker-compose.yml 使用相同的容器名和端口。
#       如果本地构建版正在运行，先执行 docker compose down。

services:
  course-report-generator:
    image: ghcr.io/kylo94/course-report-generator:${CRG_IMAGE_TAG:-latest}
    container_name: course-report
    restart: unless-stopped

    ports:
      - "8765:8765"

    volumes:
      - ./data:/app/data
      - /Users/kylo/Documents/Workspace:/Users/kylo/Documents/Workspace
      - /Users/kylo/Desktop:/Users/kylo/Desktop
      - /Users/kylo/Documents:/Users/kylo/Documents
      - /Users/kylo/Library/CloudStorage/飞牛同步-瓦力文档同步:/Users/kylo/Documents/Share
